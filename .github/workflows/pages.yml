name: deploy
on:
  push: {branches: [main]}
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Aircraft snapshot (adsb.lol, ODbL; browser can't fetch it, no CORS)
        run: python3 .github/aircraft_snapshot.py
      - name: GDELT events snapshot (open 15-min export; GEO API is gone)
        run: python3 .github/gdelt_snapshot.py || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: d
        uses: actions/deploy-pages@v4
