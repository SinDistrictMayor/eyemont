name: deploy
on:
  push: {branches: [main]}
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: {CONTACT_EMAIL: "${{ secrets.CONTACT_EMAIL }}"}
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Aircraft snapshot (adsb.lol, ODbL; browser can't fetch it, no CORS)
        run: python3 .github/aircraft_snapshot.py
      - name: GDELT events snapshot (open 15-min export; GEO API is gone)
        run: python3 .github/gdelt_snapshot.py || true
      - name: News RSS snapshot (publisher feeds, sequential)
        run: python3 .github/news_snapshot.py || true
      - name: 911 snapshot (server-side allowlist; client gets type/time/rounded coords only)
        run: python3 .github/dispatch_snapshot.py || true
      - name: Hazards snapshot
        run: python3 .github/hazards_snapshot.py || true
      - name: Replay history (rolling 24h, read back from the live site, pruned; nothing committed)
        run: python3 .github/history_snapshot.py || true
      - name: Stamp service-worker cache version with the commit SHA
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" sw.js
      - name: Guard - contact email must not be in the site bundle
        run: '[ -z "$CONTACT_EMAIL" ] || ! grep -rIqiF "$CONTACT_EMAIL" --exclude-dir=.git .'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: d
        uses: actions/deploy-pages@v4
