# GitHub disables scheduled workflows after 60 days without repo activity. A monthly tiny commit prevents that (free).
name: keepalive
on:
  schedule: [{cron: "0 6 1 * *"}]
  workflow_dispatch:
permissions: {contents: write, actions: write}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "eyemont-keepalive[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive && git commit -m "keepalive" && git push
      - run: gh workflow enable deploy -R ${{ github.repository }} || true
        env: {GH_TOKEN: "${{ github.token }}"}
